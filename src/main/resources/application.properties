# ============================================
# Raízes do Nordeste - Configurações da API
# ============================================

# Servidor
server.port=8080

# Banco de dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raizes_nordeste}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:raizes-nordeste-secret-key-2026-muito-segura-minimo-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI
springdoc.swagger-ui.operationsSorter=method

# Logs
logging.level.com.raizesnordeste=INFO
logging.level.org.springframework.security=WARN
